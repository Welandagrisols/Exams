kind = "mobile"
previewPath = "/mobile-app/"
title = "EduMetrics Mobile"
version = "1.0.0"
id = "artifacts/mobile-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile-app/" ]
localPort = 24382

[services.development]
run = "pnpm run dev"

[services.production]
build = [ "pnpm", "run", "build" ]
run = [ "pnpm", "run", "serve" ]

[services.env]
PORT = "24382"
BASE_PATH = "/mobile-app/"
